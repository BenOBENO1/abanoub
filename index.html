<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Abanoub Barsoum | E-commerce Operations Analyst</title>
<meta name="description" content="Abanoub Barsoum works in operations and finance on a food delivery marketplace in Egypt and is moving into data analysis. Projects, experience and CV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --paper:#FFFFFF; --ink:#16202E; --muted:#5B6678; --line:#E0E5ED; --accent:#2456D6; --accent-soft:#E8EEFC; --teal:#0E8F7E; --teal-soft:#DFF4F0;
  --shadow:0 1px 2px rgba(22,32,46,.05),0 10px 28px rgba(22,32,46,.07);
  --head:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 var(--body)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
h1,h2,h3,h4{font-family:var(--head);line-height:1.15;margin:0}
section{padding:60px 0 0}
h2{font-size:1.9rem;margin-bottom:22px;letter-spacing:-.01em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:600}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.plain{background:var(--bg);color:var(--muted);font-weight:400;border:1px solid var(--line)}

/* Nav */
.top{position:sticky;top:0;z-index:20;background:rgba(243,245,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:58px}
.top strong{font-family:var(--head);font-size:1.15rem;white-space:nowrap}
.top ul{display:flex;gap:20px;list-style:none;margin:0 0 0 auto;padding:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.top ul::-webkit-scrollbar{display:none}
.top ul a{color:var(--muted);text-decoration:none;font-size:.97rem}
.top ul a:hover{color:var(--ink)}
.btn{display:inline-block;padding:10px 20px;border:1.5px solid var(--accent);border-radius:10px;color:var(--accent);text-decoration:none;font-weight:600;background:var(--paper);cursor:pointer;font-family:inherit;font-size:1rem}
.btn.solid{background:var(--accent);color:#fff}
.btn:hover{filter:brightness(.96)}
.top .btn{padding:7px 16px;font-size:.92rem}

/* Hero */
.hero{padding:54px 0 8px}
.herogrid{display:grid;grid-template-columns:1fr 290px;gap:56px;align-items:center}
.open{display:inline-flex;align-items:center;gap:8px;margin:0 0 16px;color:var(--teal);font-weight:600;font-size:.95rem}
.open::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--teal)}
h1{font-size:clamp(2rem,5.6vw,3.2rem);letter-spacing:-.02em;font-weight:800}
.lede{margin:18px 0 26px;max-width:54ch;color:var(--muted);font-size:1.12rem}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.frame{aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--accent-soft);border:1px solid var(--line);box-shadow:var(--shadow)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.mono{display:grid;place-items:center;height:100%;font-family:var(--head);font-size:4.5rem;font-weight:800;color:var(--accent)}

/* Summary + contact card */
.profile{display:grid;grid-template-columns:1.35fr 1fr}
.profile .left{padding:30px 32px}
.profile .right{padding:30px 32px;background:var(--accent-soft);border-radius:0 16px 16px 0;border-left:1px solid var(--line)}
.profile h3{font-size:1.15rem;margin-bottom:14px}
.profile p{margin:0 0 14px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.nums b{display:block;font-family:var(--head);font-size:1.6rem;line-height:1.1;color:var(--accent)}
.nums span{font-size:.88rem;color:var(--muted);line-height:1.3;display:block;margin-top:2px}
.reach{list-style:none;margin:0 0 20px;padding:0}
.reach li{margin-bottom:12px}
.reach small{display:block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.reach a{font-weight:600;overflow-wrap:anywhere;color:var(--ink)}
.reach a:hover{color:var(--accent)}

/* Skills */
.skillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.skillgrid .card{padding:22px 24px}
.skillgrid h3{font-size:1.1rem;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.chips li{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 13px;font-size:.93rem}

/* Experience timeline */
.tl{position:relative;padding-left:40px}
.tl::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--line)}
.job{position:relative;margin-bottom:20px}
.job::before{content:"";position:absolute;left:-36px;top:26px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--accent)}
.job.now::before{background:var(--teal);border-color:var(--teal-soft);box-shadow:0 0 0 3px var(--teal)}
.jobcard{padding:22px 26px}
.jobtop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:flex-start}
.jobtop h3{font-size:1.25rem}
.jobtags{display:flex;gap:8px;flex-wrap:wrap}
.co{color:var(--accent);font-weight:600;margin:4px 0 8px}
.jobcard p{margin:0 0 8px;color:var(--muted)}
.jobcard ul{margin:8px 0 0;padding-left:20px}
.jobcard li{margin-bottom:6px}

/* Projects: cards side by side */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.pcard{display:flex;flex-direction:column;overflow:hidden}
.pthumb{aspect-ratio:16/9;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:contain;display:block}
.pbody{padding:22px 24px 24px;display:flex;flex-direction:column;flex:1}
.ptags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pcard h3{font-size:1.3rem;margin-bottom:8px}
.pcard .sum{margin:0 0 14px;color:var(--muted)}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 14px}
.pk div{background:var(--bg);border-radius:10px;padding:8px 12px}
.pk b{display:block;font-family:var(--head);font-size:1.25rem;line-height:1.1;color:var(--accent)}
.pk span{font-size:.82rem;color:var(--muted);line-height:1.25;display:block}
.pcard .tools{margin:0 0 16px}
.pcard .btn{margin-top:auto;align-self:flex-start}

/* Details window */
dialog{border:0;border-radius:18px;padding:0;width:min(940px,calc(100% - 24px));max-height:92vh;background:var(--paper);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(14,22,36,.6)}
.dbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;background:var(--paper);border-bottom:1px solid var(--line)}
.dbar h3{font-size:1.1rem}
.x{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:38px;height:38px;font-size:1.2rem;cursor:pointer;color:var(--ink)}
.dbody{padding:22px}
.dbody .pk{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.slider{position:relative;margin:0 0 22px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border:1px solid var(--line);border-radius:12px;scrollbar-width:none;background:#fff}
.slides::-webkit-scrollbar{display:none}
.slides figure{flex:0 0 100%;margin:0;scroll-snap-align:start}
.slides img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff}
.slides figcaption{padding:9px 14px;color:var(--muted);font-size:.92rem;border-top:1px solid var(--line);background:var(--paper)}
.sbtn{position:absolute;top:40%;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--ink);font-size:1.05rem;cursor:pointer;box-shadow:var(--shadow)}
.sprev{left:10px}.snext{right:10px}
.count{position:absolute;right:10px;top:10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:.8rem}
.dcols{display:grid;grid-template-columns:.8fr 1.2fr;gap:28px}
.dbody h4{font-size:1.05rem;margin:0 0 8px}
.dbody p{margin:0 0 14px}
.dbody ul{margin:0;padding-left:20px}
.dbody li{margin-bottom:8px}

/* Education */
.edgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.edgrid .card{padding:22px 24px}
.edgrid h3{font-size:1.1rem;margin-bottom:10px}
.edgrid ul{margin:0;padding-left:20px}
.edgrid li{margin-bottom:6px}
.edgrid p{margin:0}

footer{padding:50px 0 60px;color:var(--muted);font-size:.95rem;text-align:center}

@media (max-width:860px){
  .herogrid{grid-template-columns:1fr;gap:30px}
  .frame{max-width:260px}
  .profile{grid-template-columns:1fr}
  .profile .right{border-left:0;border-top:1px solid var(--line);border-radius:0 0 16px 16px}
  .pgrid{grid-template-columns:1fr}
  .dcols{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top strong,.top .btn{display:none}
  .top ul{margin-left:0}
  .nums{grid-template-columns:1fr}
  .profile .left,.profile .right{padding:24px 22px}
  .sbtn{display:none}
  dialog{width:100%;max-height:100vh;height:100%;border-radius:0}
}
@media print{.top,.sbtn{display:none}}
</style>
</head>
<body>

<nav class="top" aria-label="Sections"><div class="wrap">
  <strong id="navName"></strong>
  <ul>
    <li><a href="#about">About</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#experience">Experience</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#education">Education</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <a class="btn" id="navCv" href="#" style="display:none">CV</a>
</div></nav>

<header class="hero"><div class="wrap herogrid">
  <div>
    <p class="open" id="open"></p>
    <h1 id="headline"></h1>
    <p class="lede" id="intro"></p>
    <div class="btns" id="btns"></div>
  </div>
  <div id="photo"></div>
</div></header>

<main>
  <section id="about"><div class="wrap">
    <h2>About me</h2>
    <div class="card profile">
      <div class="left">
        <h3>Summary</h3>
        <div id="aboutText"></div>
        <div class="nums" id="nums"></div>
      </div>
      <div class="right" id="contact">
        <h3>Contact</h3>
        <ul class="reach" id="reach"></ul>
        <div id="cvbtn"></div>
      </div>
    </div>
  </div></section>

  <section id="skills"><div class="wrap">
    <h2>What I work with</h2>
    <div class="skillgrid" id="skillList"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <h2>Where I have worked</h2>
    <div class="tl" id="jobList"></div>
  </div></section>

  <section id="projects"><div class="wrap">
    <h2>Projects</h2>
    <div class="pgrid" id="projectList"></div>
  </div></section>

  <section id="education"><div class="wrap">
    <h2>Education and certificates</h2>
    <div class="edgrid" id="eduList"></div>
  </div></section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dbar"><h3 id="dlgTitle"></h3><button class="x" id="dlgX" aria-label="Close">&times;</button></div>
  <div class="dbody" id="dlgBody"></div>
</dialog>

<script src="data.js"></script>
<script>
(function(){
  var S = window.SITE || {}, P = window.PROJECTS || [];
  var $ = function(id){return document.getElementById(id)};
  function el(tag, cls, text){var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e}
  function list(items, cls){var ul=el("ul",cls); (items||[]).forEach(function(t){ul.appendChild(el("li",null,t))}); return ul}
  // A pasted link without https:// would be read as a page on this site, so add it when it is missing.
  function ext(u){ u=(u||"").trim(); return /^(https?:|mailto:|tel:|#)/i.test(u) ? u : (u ? "https://"+u.replace(/^\/+/,"") : u) }
  function a(label, url, cls, download){ var x=el("a",cls||null,label); x.href=url; if(/^https?:/.test(url)){x.target="_blank"; x.rel="noopener"} if(download) x.setAttribute("download",""); return x }
  var telHref = S.phone ? "tel:" + S.phone.replace(/[^+\d]/g,"") : "";
  var waHref = S.whatsapp ? "https://wa.me/" + S.whatsapp : "";

  document.title = S.name + " | " + S.role;
  $("navName").textContent = S.name;
  if (S.cv){ var nc=$("navCv"); nc.href=S.cv; nc.setAttribute("download",""); nc.style.display=""; }

  // Hero
  if (S.badge) $("open").textContent = S.badge; else $("open").style.display="none";
  $("headline").textContent = S.headline || (S.name + ", " + S.role);
  $("intro").textContent = S.intro || "";
  var B=$("btns"); B.appendChild(a("See my projects","#projects","btn solid")); B.appendChild(a("Get in touch","#contact","btn"));

  // Photo: upload photo.jpg / .jpeg / .png / .webp next to index.html. Until then the initials show.
  (function(){
    var box=$("photo"), frame=el("div","frame");
    var initials=(S.name||"").split(" ").slice(0,2).map(function(w){return w.charAt(0)}).join("").toUpperCase();
    frame.appendChild(el("div","mono",initials)); box.appendChild(frame);
    var cands = S.photo ? [S.photo] : ["photo.jpg","photo.jpeg","photo.png","photo.webp"], k=0;
    function next(){ if(k>=cands.length) return; var img=new Image(); img.onload=function(){ img.alt=S.name||""; frame.innerHTML=""; frame.appendChild(img) }; img.onerror=function(){ k++; next() }; img.src=cands[k]; }
    next();
  })();

  // Summary + contact card
  (S.about||[]).forEach(function(t){ $("aboutText").appendChild(el("p",null,t)) });
  (S.stats||[]).slice(0,3).forEach(function(s){ var d=el("div"); d.appendChild(el("b",null,s.value)); d.appendChild(el("span",null,s.label)); $("nums").appendChild(d) });
  if (!(S.stats||[]).length) $("nums").style.display="none";
  var R=$("reach");
  function row(label,text,url){ var li=el("li"); li.appendChild(el("small",null,label)); li.appendChild(a(text,url)); R.appendChild(li) }
  if (S.email) row("Email", S.email, "mailto:"+S.email);
  if (S.phone) row("Phone", S.phone, telHref);
  if (S.whatsapp) row("WhatsApp", "Send a message", waHref);
  if (S.linkedin) row("LinkedIn", "My profile", ext(S.linkedin));
  if (S.github) row("GitHub", "My repositories", ext(S.github));
  if (S.cv) $("cvbtn").appendChild(a("Download my CV", S.cv, "btn solid", true));

  // Skills
  (S.skills||[]).forEach(function(g){ var c=el("div","card"); c.appendChild(el("h3",null,g.group)); c.appendChild(list(g.items,"chips")); $("skillList").appendChild(c) });

  // Experience
  (S.experience||[]).forEach(function(j){
    var now = /present|now|current/i.test(j.when||"");
    var r=el("div","job"+(now?" now":"")), c=el("div","card jobcard");
    var top=el("div","jobtop"); top.appendChild(el("h3",null,j.title));
    var tags=el("div","jobtags"); if(now) tags.appendChild(el("span","chip teal","Current")); tags.appendChild(el("span","chip plain",j.when||"Earlier")); top.appendChild(tags);
    c.appendChild(top); c.appendChild(el("div","co",j.company));
    if (j.summary) c.appendChild(el("p",null,j.summary));
    if (j.points && j.points.length) c.appendChild(list(j.points));
    r.appendChild(c); $("jobList").appendChild(r);
  });

  // Projects as cards, side by side. "View details" opens a window.
  var dlg=$("dlg"), body=$("dlgBody");
  function kpiBox(p){ var k=el("div","pk"); (p.kpis||[]).forEach(function(x){ var d=el("div"); d.appendChild(el("b",null,x.value)); d.appendChild(el("span",null,x.label)); k.appendChild(d) }); return k }
  function openProject(p){
    $("dlgTitle").textContent = p.title; body.innerHTML = "";
    if (p.kpis && p.kpis.length) body.appendChild(kpiBox(p));
    if (p.images && p.images.length){
      var sl=el("div","slider"), tr=el("div","slides");
      p.images.forEach(function(im){
        var f=el("figure"), ln=a("",im.src), i=el("img"); i.src=im.src; i.alt=im.alt||im.caption||"";
        i.onerror=function(){ f.remove(); upd() };
        ln.appendChild(i); f.appendChild(ln); if(im.caption) f.appendChild(el("figcaption",null,im.caption)); tr.appendChild(f);
      });
      var cnt=el("span","count","1 / "+p.images.length), pv=el("button","sbtn sprev","\u2190"), nx=el("button","sbtn snext","\u2192");
      pv.setAttribute("aria-label","Previous image"); nx.setAttribute("aria-label","Next image");
      function upd(){ var n=tr.children.length; if(!n){ sl.style.display="none"; return } var k=Math.round(tr.scrollLeft/Math.max(tr.clientWidth,1))+1; cnt.textContent=Math.min(k,n)+" / "+n }
      pv.onclick=function(){ tr.scrollBy({left:-tr.clientWidth,behavior:"smooth"}) };
      nx.onclick=function(){ tr.scrollBy({left:tr.clientWidth,behavior:"smooth"}) };
      tr.addEventListener("scroll",upd);
      sl.appendChild(tr); sl.appendChild(pv); sl.appendChild(nx); sl.appendChild(cnt); body.appendChild(sl);
    }
    var cols=el("div","dcols"), c1=el("div"), c2=el("div");
    c1.appendChild(el("p",null,p.summary||""));
    if (p.problem){ c1.appendChild(el("h4",null,"The question")); c1.appendChild(el("p",null,p.problem)); }
    if (p.tools && p.tools.length){ c1.appendChild(el("h4",null,"Tools")); c1.appendChild(el("p",null,p.tools.join(", "))); }
    (p.links||[]).forEach(function(l){ if(l.url){ var pp=el("p"); pp.appendChild(a(l.label,l.url,"btn")); c1.appendChild(pp) } });
    if (p.findings && p.findings.length){ c2.appendChild(el("h4",null,"What I found")); c2.appendChild(list(p.findings)); }
    cols.appendChild(c1); cols.appendChild(c2); body.appendChild(cols);
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
    dlg.scrollTop = 0;
  }
  $("dlgX").onclick=function(){ dlg.close() };
  dlg.addEventListener("click",function(e){ if(e.target===dlg) dlg.close() });

  P.forEach(function(p){
    var c=el("article","card pcard");
    var thumbSrc = p.thumb || (p.images && p.images[0] && p.images[0].src);
    if (thumbSrc){ var t=el("div","pthumb"), im=el("img"); im.src=thumbSrc; im.alt=""; im.loading="lazy"; im.onerror=function(){ t.style.display="none" }; t.appendChild(im); c.appendChild(t) }
    var b=el("div","pbody"), tg=el("div","ptags");
    if (p.date) tg.appendChild(el("span","chip",p.date)); if (p.note) tg.appendChild(el("span","chip plain",p.note));
    b.appendChild(tg); b.appendChild(el("h3",null,p.title)); b.appendChild(el("p","sum",p.summary));
    if (p.kpis && p.kpis.length) b.appendChild(kpiBox(p));
    var bt=el("button","btn solid","View details"); bt.onclick=function(){ openProject(p) };
    b.appendChild(bt); c.appendChild(b); $("projectList").appendChild(c);
  });

  // Education
  var E=$("eduList");
  function box(title, items){ if(items && items.length){ var c=el("div","card"); c.appendChild(el("h3",null,title)); c.appendChild(list(items)); E.appendChild(c) } }
  box("Education", S.education); box("Certificates", S.certifications);
  if (S.languages){ var lc=el("div","card"); lc.appendChild(el("h3",null,"Languages")); lc.appendChild(el("p",null,S.languages)); E.appendChild(lc) }

  $("foot").textContent = S.name + ", " + (S.location||"") + ". Last updated " + new Date().toLocaleDateString("en-GB",{month:"long",year:"numeric"}) + ".";

  // Visitor counter (GoatCounter). Put your code in data.js to switch it on.
  if (S.goatcounter){
    var s=document.createElement("script"); s.async=true; s.src="https://gc.zgo.at/count.js";
    s.setAttribute("data-goatcounter","https://"+S.goatcounter+".goatcounter.com/count"); document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
