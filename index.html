<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abanoub Barsoum | E-commerce Operations Analyst</title>
<meta name="description" content="Portfolio of Abanoub Barsoum, an operations analyst who turns marketplace and restaurant-branch data into decisions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8FA; --paper:#FFFFFF; --ink:#14212B; --muted:#52636F;
  --line:#D9E2E8; --accent:#0B5FA5; --accent-ink:#FFFFFF; --green:#1E7B4F;
  --head:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1A22; --paper:#16252F; --ink:#E7EEF3; --muted:#9DB0BC; --line:#28404F; --accent:#5AB0F0; --accent-ink:#0F1A22; --green:#5CC796;}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:56px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--body)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4{font-family:var(--head);line-height:1.15;margin:0}

/* Navigation */
.nav{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:52px}
.nav strong{font-family:var(--head);white-space:nowrap}
.nav ul{display:flex;gap:18px;list-style:none;margin:0 0 0 auto;padding:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{color:var(--muted);text-decoration:none;font-size:.95rem}
.nav a:hover{color:var(--accent);text-decoration:underline}

/* Hero: a spreadsheet, because that is where the work starts */
.hero{padding:36px 0 56px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 40px;border-bottom:1px solid var(--line)}
.sheet{background:var(--paper);border:1px solid var(--line);margin-bottom:28px;overflow:hidden}
.fbar{display:flex;gap:12px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);font-size:.95rem;color:var(--muted)}
.fbar #formula{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx{font-style:italic;font-weight:600;color:var(--green)}
.cols{display:grid;grid-template-columns:36px repeat(5,1fr);font-size:.8rem;color:var(--muted)}
.cols span{padding:3px 0;text-align:center;border-right:1px solid var(--line)}
.cols span:last-child{border-right:0}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);padding:4px 12px;font-size:.95rem;margin-bottom:16px}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
.cell{display:inline-block;position:relative;background:var(--paper);border:2px solid var(--accent);padding:6px 16px 8px}
.cell::after{content:"";position:absolute;right:-6px;bottom:-6px;width:9px;height:9px;background:var(--accent);border:2px solid var(--paper)}
h1{font-size:clamp(2rem,8vw,4rem);letter-spacing:-.02em}
.role{font-family:var(--head);font-weight:600;font-size:1.3rem;margin:22px 0 6px}
.lede{max-width:60ch;margin:0 0 22px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;padding:10px 18px;border:2px solid var(--accent);color:var(--accent);text-decoration:none;font-weight:600;background:var(--paper)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:hover{text-decoration:underline}

section{padding:52px 0;border-bottom:1px solid var(--line)}
section>.wrap>h2{font-size:1.9rem;margin-bottom:26px}

/* About */
.about p{max-width:68ch;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;margin:28px 0;border:1px solid var(--line);background:var(--paper)}
.stat{padding:18px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--head);font-size:2rem;line-height:1.1;color:var(--accent)}
.stat span{color:var(--muted);font-size:.95rem}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:8px}
.how h3{font-size:1.1rem;margin-bottom:6px}
.how p{margin:0;color:var(--muted)}
.how div{border-top:3px solid var(--accent);padding-top:12px}

/* Projects */
.project{background:var(--paper);border:1px solid var(--line);padding:24px;margin-bottom:24px}
.project h3{font-size:1.5rem;margin-bottom:4px}
.meta{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:14px 0}
.tags li{border:1px solid var(--line);padding:2px 10px;font-size:.9rem;background:var(--bg)}
.project h4{margin:18px 0 6px;font-size:1.05rem}
.project ul.pts{margin:0;padding-left:20px}
.project ul.pts li{margin-bottom:6px}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px}
.shots figure{margin:0}
.shots img{width:100%;height:auto;display:block;border:1px solid var(--line)}
.shots figcaption{font-size:.85rem;color:var(--muted);margin-top:4px}

/* Experience, skills */
.job{display:grid;grid-template-columns:200px 1fr;gap:6px 28px;padding:18px 0;border-top:1px solid var(--line)}
.job:first-of-type{border-top:0;padding-top:0}
.job .when{color:var(--muted);font-size:.95rem}
.job h3{font-size:1.15rem}
.job p{margin:4px 0 0}
.job ul{margin:6px 0 0;padding-left:20px}
.job li{margin-bottom:4px}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}
.skillgrid h3{font-size:1.05rem;margin-bottom:8px}
.skillgrid ul,.edu ul{margin:0;padding-left:20px}
.edu h3{font-size:1.05rem;margin:18px 0 8px}
.edu h3:first-child{margin-top:0}
.edu p{margin:0}
footer{padding:36px 0 60px;color:var(--muted);font-size:.95rem}
@media (max-width:640px){
  .job{grid-template-columns:1fr}
  .nav strong{display:none}
  .nav ul{margin-left:0}
  .cols span:nth-child(n+5){display:none}
  .cols{grid-template-columns:36px repeat(3,1fr)}
  .hero{background-size:48px 40px}
  .stat{border-right:0;border-bottom:1px solid var(--line)}
  .stat:last-child{border-bottom:0}
}
@media print{.hero{background:none}.nav{display:none}.btn{border:0}}
</style>
</head>
<body>

<nav class="nav" aria-label="Sections"><div class="wrap">
  <strong id="navName"></strong>
  <ul>
    <li><a href="#about">About</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#experience">Experience</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#education">Education</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</div></nav>

<header class="hero">
  <div class="wrap">
    <div class="sheet" aria-hidden="true">
      <div class="fbar"><span class="fx">fx</span><span id="formula"></span></div>
      <div class="cols"><span></span><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span></div>
    </div>
    <div class="badge" id="badge"></div>
    <h1><span class="cell" id="name"></span></h1>
    <p class="role" id="role"></p>
    <p class="lede" id="intro"></p>
    <div class="links" id="links"></div>
  </div>
</header>

<main>
  <section id="about"><div class="wrap about">
    <h2>About</h2>
    <div id="aboutText"></div>
    <div class="stats" id="stats"></div>
    <div class="how" id="how"></div>
  </div></section>

  <section id="projects"><div class="wrap">
    <h2>Projects</h2>
    <div id="projectList"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <h2>Experience</h2>
    <div id="jobList"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <h2>Skills</h2>
    <div class="skillgrid" id="skillList"></div>
  </div></section>

  <section id="education"><div class="wrap">
    <h2>Education and certificates</h2>
    <div class="edu" id="eduList"></div>
  </div></section>

  <section id="contact" style="border-bottom:0"><div class="wrap">
    <h2>Contact</h2>
    <p>Hiring for an analytics or operations role? Send me a message or download my CV.</p>
    <div class="links" id="contactLinks"></div>
  </div></section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<script src="data.js"></script>
<script>
(function(){
  var S = window.SITE || {}, P = window.PROJECTS || [];
  var $ = function(id){return document.getElementById(id)};
  function el(tag, cls, text){var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e}
  function list(items, cls){var ul=el("ul",cls); (items||[]).forEach(function(t){ul.appendChild(el("li",null,t))}); return ul}
  function link(label, url, primary, download){var a=el("a","btn"+(primary?" primary":""),label); a.href=url; if(/^https?:/.test(url)){a.target="_blank"; a.rel="noopener"} if(download) a.setAttribute("download",""); return a}

  document.title = S.name + " | " + S.role;
  $("navName").textContent = S.name;
  $("formula").textContent = S.formula || "";
  if (S.badge) $("badge").textContent = S.badge; else $("badge").style.display="none";
  $("name").textContent = S.name;
  $("role").textContent = S.role + (S.location ? ", " + S.location : "");
  $("intro").textContent = S.intro || "";

  var links = $("links"), contact = $("contactLinks");
  links.appendChild(link("See my projects", "#projects", true));
  if (S.cv) links.appendChild(link("Download CV", S.cv, false, true));
  if (S.linkedin) links.appendChild(link("LinkedIn", S.linkedin));
  if (S.github) links.appendChild(link("GitHub", S.github));
  if (S.email) contact.appendChild(link(S.email, "mailto:" + S.email, true));
  if (S.cv) contact.appendChild(link("Download CV", S.cv, false, true));
  if (S.linkedin) contact.appendChild(link("LinkedIn", S.linkedin));
  if (S.github) contact.appendChild(link("GitHub", S.github));

  // About
  (S.about||[]).forEach(function(t){ $("aboutText").appendChild(el("p",null,t)) });
  (S.stats||[]).forEach(function(s){ var d=el("div","stat"); d.appendChild(el("b",null,s.value)); d.appendChild(el("span",null,s.label)); $("stats").appendChild(d) });
  (S.how||[]).forEach(function(h){ var d=el("div"); d.appendChild(el("h3",null,h.title)); d.appendChild(el("p",null,h.text)); $("how").appendChild(d) });

  // Projects
  P.forEach(function(p){
    var a = el("article","project");
    a.appendChild(el("h3",null,p.title));
    a.appendChild(el("p","meta",[p.date,p.note].filter(Boolean).join(". ")));
    a.appendChild(el("p",null,p.summary));
    if (p.tools && p.tools.length) a.appendChild(list(p.tools,"tags"));
    if (p.problem){a.appendChild(el("h4",null,"The question")); a.appendChild(el("p",null,p.problem));}
    if (p.findings && p.findings.length){a.appendChild(el("h4",null,"What I found")); a.appendChild(list(p.findings,"pts"));}
    if (p.images && p.images.length){
      var g = el("div","shots");
      p.images.forEach(function(im){
        var f = el("figure"), ln = el("a"), i = el("img");
        ln.href = im.src; ln.target = "_blank"; ln.rel = "noopener";
        i.src = im.src; i.alt = im.alt || im.caption || ""; i.loading = "lazy";
        i.onerror = function(){f.style.display="none"};
        ln.appendChild(i); f.appendChild(ln);
        if (im.caption) f.appendChild(el("figcaption",null,im.caption));
        g.appendChild(f);
      });
      a.appendChild(g);
    }
    if (p.links && p.links.length){
      var row = el("div","links"); row.style.marginTop="18px";
      p.links.forEach(function(l){ if(l.url) row.appendChild(link(l.label,l.url)) });
      if (row.children.length) a.appendChild(row);
    }
    $("projectList").appendChild(a);
  });

  // Experience
  (S.experience||[]).forEach(function(j){
    var r = el("div","job");
    r.appendChild(el("div","when",j.when));
    var d = el("div"); d.appendChild(el("h3",null,j.title+", "+j.company));
    if (j.summary) d.appendChild(el("p",null,j.summary));
    if (j.points && j.points.length) d.appendChild(list(j.points));
    r.appendChild(d); $("jobList").appendChild(r);
  });

  // Skills and education
  (S.skills||[]).forEach(function(g){
    var d = el("div"); d.appendChild(el("h3",null,g.group)); d.appendChild(list(g.items)); $("skillList").appendChild(d);
  });
  var edu = $("eduList");
  if (S.education && S.education.length){ edu.appendChild(el("h3",null,"Education")); edu.appendChild(list(S.education)); }
  if (S.certifications && S.certifications.length){ edu.appendChild(el("h3",null,"Certificates")); edu.appendChild(list(S.certifications)); }
  if (S.languages){ edu.appendChild(el("h3",null,"Languages")); edu.appendChild(el("p",null,S.languages)); }

  $("foot").textContent = "\u00A9 " + new Date().getFullYear() + " " + S.name + ". Updated as I finish new projects.";

  // Visitor analytics (GoatCounter). Set S.goatcounter in data.js to turn it on.
  if (S.goatcounter){
    var s = document.createElement("script");
    s.async = true; s.src = "https://gc.zgo.at/count.js";
    s.setAttribute("data-goatcounter","https://"+S.goatcounter+".goatcounter.com/count");
    document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
