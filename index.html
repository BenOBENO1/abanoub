<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abanoub Barsoum | E-commerce Operations Analyst</title>
<meta name="description" content="Abanoub Barsoum works in operations and finance on a food delivery marketplace in Egypt and is moving into data analysis. Projects, experience and CV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F8FA; --paper:#FFFFFF; --ink:#1B2430; --muted:#5C6675; --line:#DCE1E8; --accent:#1F4E9C; --accent-ink:#FFFFFF; --ok:#2E7D4F;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12171F; --paper:#18202B; --ink:#E6EAF0; --muted:#9CA8B8; --line:#2B3645; --accent:#7FA8E8; --accent-ink:#12171F; --ok:#6CC08C;}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 var(--sans)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding:0 22px}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.2;margin:0}
section{padding:56px 0 8px}
h2{font-size:1.65rem;margin-bottom:20px;padding-top:18px;border-top:1px solid var(--line)}

/* Top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;height:54px}
.top strong{font-family:var(--serif);font-size:1.1rem;white-space:nowrap}
.top ul{display:flex;gap:18px;list-style:none;margin:0;padding:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.top ul::-webkit-scrollbar{display:none}
.top a{color:var(--muted);text-decoration:none;font-size:.97rem}
.top a:hover{color:var(--ink);text-decoration:underline}

/* Hero */
.hero{padding:52px 0 40px}
.herogrid{display:grid;grid-template-columns:1fr 250px;gap:48px;align-items:start}
.open{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem;margin:0 0 14px}
.open::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
h1{font-size:clamp(1.9rem,5.4vw,2.9rem);letter-spacing:-.01em;font-weight:700}
.lede{margin:18px 0 24px;max-width:56ch;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;padding:10px 18px;border:1.5px solid var(--accent);border-radius:4px;color:var(--accent);text-decoration:none;font-weight:600;background:transparent;cursor:pointer;font-family:inherit;font-size:1rem}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.btn:hover{text-decoration:underline}
.reach{margin:18px 0 0;font-size:.97rem;color:var(--muted)}
.reach a{color:var(--muted)}
.photo{width:100%}
.frame{aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:var(--line);border:1px solid var(--line)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.mono{display:grid;place-items:center;height:100%;font-family:var(--serif);font-size:4rem;font-weight:700;color:var(--muted)}

/* About */
.about p{margin:0 0 14px;max-width:64ch}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:22px;margin-top:28px}
.num{border-top:3px solid var(--accent);padding-top:10px}
.num b{display:block;font-family:var(--serif);font-size:2rem;line-height:1.1}
.num span{color:var(--muted);font-size:.95rem}

/* Skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px}
.skills h3{font-size:1.05rem;margin-bottom:8px}
.skills ul,.edu ul{margin:0;padding-left:20px}
.skills li,.edu li{margin-bottom:4px}

/* Experience */
.job{display:grid;grid-template-columns:170px 1fr;gap:4px 26px;padding:18px 0;border-top:1px solid var(--line)}
.job:first-of-type{border-top:0;padding-top:0}
.job .when{color:var(--muted);font-size:.95rem}
.job h3{font-size:1.15rem}
.job .co{color:var(--muted);margin:2px 0 6px}
.job p{margin:0 0 6px}
.job ul{margin:6px 0 0;padding-left:20px}
.job li{margin-bottom:5px}

/* Projects */
.project{padding:26px 0;border-top:1px solid var(--line)}
.project:first-of-type{border-top:0;padding-top:0}
.pk{display:flex;flex-wrap:wrap;gap:0;margin:0 0 20px}
.pk div{padding:2px 22px 2px 14px;border-left:3px solid var(--accent);margin-right:6px;margin-bottom:8px}
.pk b{display:block;font-family:var(--serif);font-size:1.5rem;line-height:1.1}
.pk span{display:block;font-size:.88rem;color:var(--muted);max-width:18ch;line-height:1.3}
.phead{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
.thumb{width:100%;aspect-ratio:16/10;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px}
.project h3{font-size:1.4rem;margin-bottom:6px}
.meta{color:var(--muted);font-size:.93rem;margin:0 0 10px}
.sum{margin:0 0 10px}
.tools{color:var(--muted);font-size:.95rem;margin:0 0 12px}
.more[hidden]{display:none}
.more{margin-top:20px}
.slider{position:relative;margin:0 0 20px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border:1px solid var(--line);border-radius:4px;scrollbar-width:none;background:#fff}
.slides::-webkit-scrollbar{display:none}
.slides figure{flex:0 0 100%;margin:0;scroll-snap-align:start}
.slides img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff}
.slides figcaption{padding:8px 12px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);background:var(--paper)}
.sbtn{position:absolute;top:40%;width:38px;height:38px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font-size:1.05rem;cursor:pointer}
.sprev{left:8px}.snext{right:8px}
.count{position:absolute;right:8px;top:8px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 8px;font-size:.8rem}
.cols{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px}
.more h4{font-size:1rem;margin:0 0 8px}
.more p{margin:0 0 14px}
.more ul{margin:0;padding-left:20px}
.more li{margin-bottom:8px}

/* Contact, footer */
.contact ul{list-style:none;margin:16px 0 0;padding:0}
.contact li{margin-bottom:6px}
.contact li span{display:inline-block;min-width:92px;color:var(--muted)}
footer{padding:44px 0 56px;color:var(--muted);font-size:.93rem}

@media (max-width:760px){
  .herogrid{grid-template-columns:1fr;gap:28px}
  .photo{width:200px}
  .job{grid-template-columns:1fr}
  .phead,.cols{grid-template-columns:1fr}
  .top strong{display:none}
  .sbtn{display:none}
}
@media print{.top,.sbtn{display:none}}
</style>
</head>
<body>

<nav class="top" aria-label="Sections"><div class="wrap">
  <strong id="navName"></strong>
  <ul>
    <li><a href="#about">About</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#experience">Experience</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#education">Education</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</div></nav>

<header class="hero"><div class="wrap herogrid">
  <div>
    <p class="open" id="open"></p>
    <h1 id="headline"></h1>
    <p class="lede" id="intro"></p>
    <div class="btns" id="btns"></div>
    <p class="reach" id="reach"></p>
  </div>
  <div class="photo" id="photo"></div>
</div></header>

<main>
  <section id="about"><div class="wrap about">
    <h2>About</h2>
    <div id="aboutText"></div>
    <div class="nums" id="nums"></div>
  </div></section>

  <section id="skills"><div class="wrap">
    <h2>What I work with</h2>
    <div class="skills" id="skillList"></div>
  </div></section>

  <section id="experience"><div class="wrap">
    <h2>Where I have worked</h2>
    <div id="jobList"></div>
  </div></section>

  <section id="projects"><div class="wrap">
    <h2>Projects</h2>
    <div id="projectList"></div>
  </div></section>

  <section id="education"><div class="wrap edu">
    <h2>Education and certificates</h2>
    <div id="eduList"></div>
  </div></section>

  <section id="contact"><div class="wrap contact">
    <h2>Contact</h2>
    <p id="contactText"></p>
    <ul id="contactList"></ul>
  </div></section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<script src="data.js"></script>
<script>
(function(){
  var S = window.SITE || {}, P = window.PROJECTS || [];
  var $ = function(id){return document.getElementById(id)};
  function el(tag, cls, text){var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e}
  function list(items){var ul=el("ul"); (items||[]).forEach(function(t){ul.appendChild(el("li",null,t))}); return ul}
  // A pasted link without https:// would be read as a page on this site, so add it when it is missing.
  function ext(u){ u=(u||"").trim(); return /^(https?:|mailto:|tel:|#)/i.test(u) ? u : (u ? "https://"+u.replace(/^\/+/,"") : u) }
  function a(label, url, cls, download){ var x=el("a",cls||null,label); x.href=url; if(/^https?:/.test(url)){x.target="_blank"; x.rel="noopener"} if(download) x.setAttribute("download",""); return x }
  var telHref = S.phone ? "tel:" + S.phone.replace(/[^+\d]/g,"") : "";
  var waHref = S.whatsapp ? "https://wa.me/" + S.whatsapp : "";

  document.title = S.name + " | " + S.role;
  $("navName").textContent = S.name;
  if (S.badge) $("open").textContent = S.badge; else $("open").style.display = "none";
  $("headline").textContent = S.headline || (S.name + ", " + S.role);
  $("intro").textContent = S.intro || "";
  var B = $("btns");
  B.appendChild(a("See my projects","#projects","btn solid"));
  if (S.cv) B.appendChild(a("Download CV", S.cv, "btn", true));
  var R = $("reach");
  if (S.email){ R.appendChild(a(S.email,"mailto:"+S.email)); }
  if (S.email && S.phone) R.appendChild(document.createTextNode("  \u00B7  "));
  if (S.phone){ R.appendChild(a(S.phone, telHref)); }

  // Photo: upload photo.jpg / .jpeg / .png / .webp next to index.html. Until then the initials show.
  (function(){
    var box=$("photo"), frame=el("div","frame");
    var initials=(S.name||"").split(" ").slice(0,2).map(function(w){return w.charAt(0)}).join("").toUpperCase();
    frame.appendChild(el("div","mono",initials)); box.appendChild(frame);
    var cands = S.photo ? [S.photo] : ["photo.jpg","photo.jpeg","photo.png","photo.webp"], k=0;
    function next(){ if(k>=cands.length) return; var img=new Image(); img.onload=function(){ img.alt=S.name||""; frame.innerHTML=""; frame.appendChild(img) }; img.onerror=function(){ k++; next() }; img.src=cands[k]; }
    next();
  })();

  // About
  (S.about||[]).forEach(function(t){ $("aboutText").appendChild(el("p",null,t)) });
  (S.stats||[]).forEach(function(s){ var d=el("div","num"); d.appendChild(el("b",null,s.value)); d.appendChild(el("span",null,s.label)); $("nums").appendChild(d) });

  // Skills
  (S.skills||[]).forEach(function(g){ var d=el("div"); d.appendChild(el("h3",null,g.group)); d.appendChild(list(g.items)); $("skillList").appendChild(d) });

  // Experience
  (S.experience||[]).forEach(function(j){
    var r=el("div","job"); r.appendChild(el("div","when",j.when||"Earlier"));
    var d=el("div"); d.appendChild(el("h3",null,j.title)); d.appendChild(el("div","co",j.company));
    if (j.summary) d.appendChild(el("p",null,j.summary));
    if (j.points && j.points.length) d.appendChild(list(j.points));
    r.appendChild(d); $("jobList").appendChild(r);
  });

  // Projects
  P.forEach(function(p){
    var art=el("article","project");
    if (p.kpis && p.kpis.length){
      var kr=el("div","pk"); p.kpis.forEach(function(x){ var c=el("div"); c.appendChild(el("b",null,x.value)); c.appendChild(el("span",null,x.label)); kr.appendChild(c) }); art.appendChild(kr);
    }
    var head=el("div","phead"), thumbSrc = p.thumb || (p.images && p.images[0] && p.images[0].src);
    if (thumbSrc){ var th=el("img","thumb"); th.src=thumbSrc; th.alt=""; th.loading="lazy"; th.onerror=function(){ th.style.display="none" }; head.appendChild(th) }
    var info=el("div");
    info.appendChild(el("h3",null,p.title));
    info.appendChild(el("p","meta",[p.date,p.note].filter(Boolean).join(" \u00B7 ")));
    info.appendChild(el("p","sum",p.summary));
    if (p.tools && p.tools.length) info.appendChild(el("p","tools","Tools: "+p.tools.join(", ")));
    var more=el("div","more"); more.hidden=true;
    var btn=el("button","btn","Show the details"); btn.setAttribute("aria-expanded","false"); info.appendChild(btn);
    head.appendChild(info); art.appendChild(head);

    if (p.images && p.images.length){
      var sl=el("div","slider"), tr=el("div","slides");
      p.images.forEach(function(im){
        var f=el("figure"), ln=a("",im.src), i=el("img"); i.src=im.src; i.alt=im.alt||im.caption||""; i.loading="lazy";
        i.onerror=function(){ f.remove(); upd() };
        ln.appendChild(i); f.appendChild(ln); if(im.caption) f.appendChild(el("figcaption",null,im.caption)); tr.appendChild(f);
      });
      var cnt=el("span","count","1 / "+p.images.length), pv=el("button","sbtn sprev","\u2190"), nx=el("button","sbtn snext","\u2192");
      pv.setAttribute("aria-label","Previous image"); nx.setAttribute("aria-label","Next image");
      function upd(){ var n=tr.children.length; if(!n){ sl.style.display="none"; return } var k=Math.round(tr.scrollLeft/Math.max(tr.clientWidth,1))+1; cnt.textContent=Math.min(k,n)+" / "+n }
      pv.onclick=function(){ tr.scrollBy({left:-tr.clientWidth,behavior:"smooth"}) };
      nx.onclick=function(){ tr.scrollBy({left:tr.clientWidth,behavior:"smooth"}) };
      tr.addEventListener("scroll",upd);
      sl.appendChild(tr); sl.appendChild(pv); sl.appendChild(nx); sl.appendChild(cnt); more.appendChild(sl);
    }
    var cols=el("div","cols"), c1=el("div"), c2=el("div");
    if (p.problem){ c1.appendChild(el("h4",null,"The question")); c1.appendChild(el("p",null,p.problem)); }
    if (p.links && p.links.length){ p.links.forEach(function(l){ if(l.url){ var pp=el("p"); pp.appendChild(a(l.label,l.url)); c1.appendChild(pp) } }) }
    if (p.findings && p.findings.length){ c2.appendChild(el("h4",null,"What I found")); c2.appendChild(list(p.findings)); }
    cols.appendChild(c1); cols.appendChild(c2); more.appendChild(cols); art.appendChild(more);
    btn.onclick=function(){ var open=more.hidden; more.hidden=!open; btn.textContent=open?"Hide the details":"Show the details"; btn.setAttribute("aria-expanded",String(open)) };
    $("projectList").appendChild(art);
  });

  // Education
  var E=$("eduList");
  function block(title, items){ if(items && items.length){ E.appendChild(el("h3",null,title)); E.lastChild.style.margin="14px 0 6px"; E.appendChild(list(items)) } }
  block("Education", S.education); block("Certificates", S.certifications);
  if (S.languages){ E.appendChild(el("h3",null,"Languages")); E.lastChild.style.margin="14px 0 6px"; E.appendChild(el("p",null,S.languages)); }

  // Contact
  $("contactText").textContent = S.contactText || "If you are hiring for a data analyst or operations role, or you just want to talk about a report, write to me.";
  var C=$("contactList");
  function row(label, text, url, dl){ var li=el("li"); li.appendChild(el("span",null,label)); li.appendChild(a(text,url,null,dl)); C.appendChild(li) }
  if (S.email) row("Email", S.email, "mailto:"+S.email);
  if (S.phone) row("Phone", S.phone, telHref);
  if (S.whatsapp) row("WhatsApp", "Send a message", waHref);
  if (S.linkedin) row("LinkedIn", "My profile", ext(S.linkedin));
  if (S.github) row("GitHub", "My repositories", ext(S.github));
  if (S.cv) row("CV", "Download (PDF)", S.cv, true);

  $("foot").textContent = S.name + ", " + (S.location||"") + ". Last updated " + new Date().toLocaleDateString("en-GB",{month:"long",year:"numeric"}) + ".";

  // Visitor counter (GoatCounter). Put your code in data.js to switch it on.
  if (S.goatcounter){
    var s=document.createElement("script"); s.async=true; s.src="https://gc.zgo.at/count.js";
    s.setAttribute("data-goatcounter","https://"+S.goatcounter+".goatcounter.com/count"); document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
